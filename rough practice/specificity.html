<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specificity</title>

    <link rel="stylesheet" href="specificity.css">
</head>

<body>

    <h1>CSS Specificity</h1>

    <div class="container">

        <div class="box" id="box1">
            <h2>Box 1</h2>
            <p>This box demonstrates ID specificity.</p>
        </div>

        <div class="box box2">
            <h2>Box 2</h2>
            <p>This box demonstrates class specificity.</p>
        </div>

        <div class="box box3">
            <h2>Box 3</h2>
            <p>This box demonstrates multiple classes.</p>
        </div>

        <div class="box box4">
            <h2>Box 4</h2>
            <p>This box demonstrates element selectors.</p>
        </div>

    </div>

</body>
</html>
