<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 13.2 — Floats, Flex, Position, Borders, Shadows, Visibility</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <!-- ============================================================
       1) FLEX TOOLBAR
       d-flex                  -> display: flex
       justify-content-between -> title left, button right
       align-items-center      -> vertical centering
       ============================================================ -->
  <h2 class="h5 mb-3">1. Flex Toolbar</h2>
  <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded mb-4">
    <span class="fw-bold">Dashboard</span>
    <button class="btn btn-sm btn-primary">Logout</button>
  </div>

  <!-- ============================================================
       2) CART ICON WITH POSITIONED BADGE
       position-relative on the parent creates the positioning context.
       position-absolute on the badge removes it from normal flow.
       top-0 start-100 translate-middle -> pins it to the top-right corner.
       ============================================================ -->
  <h2 class="h5 mb-3">2. Cart Icon with Badge</h2>
  <button class="btn btn-outline-dark position-relative mb-4">
    🛒 Cart
    <span class="position-absolute top-0 start-100 translate-middle
                 badge rounded-pill bg-danger">
      3
      <span class="visually-hidden">items in cart</span>
    </span>
  </button>

  <!-- ============================================================
       3) CIRCULAR PROFILE IMAGE — border + shadow
       rounded-circle -> border-radius: 50%
       border border-3 border-primary -> 3px primary-coloured border
       shadow -> default soft drop shadow
       ============================================================ -->
  <h2 class="h5 mb-3">3. Bordered &amp; Shadowed Avatar</h2>
  <img src="https://placehold.co/100x100/6c757d/ffffff?text=AK"
       class="rounded-circle border border-3 border-primary shadow mb-4"
       width="80" height="80" alt="Profile avatar">

  <!-- Elevated card-like box using only shadow utilities -->
  <div class="p-4 shadow-lg rounded bg-white mb-4" style="max-width: 320px;">
    Elevated card-like box
  </div>

  <!-- ============================================================
       4) THREE BOXES IN A FLEX ROW — one centers its text
       The outer div is d-flex. The middle box is ALSO a flex container
       so justify-content-center + align-items-center can center its text.
       ============================================================ -->
  <h2 class="h5 mb-3">4. Flex Row with a Centered Box</h2>
  <div class="d-flex gap-3 mb-4">
    <div class="bg-secondary text-white p-4 rounded flex-fill">Box 1</div>

    <!-- This box is itself a flex container that centers its content -->
    <div class="bg-primary text-white p-4 rounded flex-fill
                d-flex justify-content-center align-items-center"
         style="min-height: 100px;">
      Box 2 (centered)
    </div>

    <div class="bg-secondary text-white p-4 rounded flex-fill">Box 3</div>
  </div>

  <!-- ============================================================
       5) invisible vs d-none
       .invisible -> visibility: hidden  -> element still OCCUPIES space
       .d-none    -> display: none       -> element is REMOVED from layout
       Compare the two boxes below in DevTools.
       ============================================================ -->
  <h2 class="h5 mb-3">5. invisible vs d-none</h2>

  <div class="d-flex gap-3 align-items-start">
    <!-- Still takes up its full box in the layout -->
    <div class="invisible bg-warning p-4 rounded" style="width: 160px;">
      invisible
    </div>

    <!-- Collapsed to nothing; the third box slides left -->
    <div class="d-none bg-danger text-white p-4 rounded" style="width: 160px;">
      d-none
    </div>

    <!-- Control box so you can see the layout shift -->
    <div class="bg-success text-white p-4 rounded" style="width: 160px;">
      Control
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
