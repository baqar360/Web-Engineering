<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 10.2 — Modal, Toast, Popover &amp; Tooltip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h2 class="h4 mb-3">Interactive Components Demo</h2>

  <!-- ============================================================
       1) DELETE-ACCOUNT MODAL TRIGGER
       ============================================================ -->
  <button type="button" class="btn btn-danger"
          data-bs-toggle="modal" data-bs-target="#deleteAccountModal">
    Delete Account
  </button>

  <!-- ============================================================
       MODAL MARKUP
         .modal.fade          -> the overlay wrapper (animated)
         tabindex="-1"        -> makes the dialog focusable/keyboard-safe
         .modal-dialog        -> positioning wrapper
         .modal-content       -> the visible white box
         data-bs-dismiss      -> closes the modal (JS handles it)
       ============================================================ -->
  <div class="modal fade" id="deleteAccountModal" tabindex="-1"
       aria-labelledby="deleteAccountLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="deleteAccountLabel">Confirm Deletion</h5>
          <button type="button" class="btn-close"
                  data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          Are you sure you want to delete your account?
          This action <strong>cannot be undone</strong>.
        </div>

        <div class="modal-footer">
          <!-- Cancel button — text added (manual left it empty) -->
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <!-- Confirm button — would POST to the server in a real app -->
          <button type="button" class="btn btn-danger">Confirm Delete</button>
        </div>

      </div>
    </div>
  </div>

  <hr class="my-4">

  <!-- ============================================================
       2) SAVE BUTTON -> TOAST
       ============================================================ -->
  <button type="button" class="btn btn-primary" id="saveBtn">Save</button>

  <!-- ============================================================
       TOAST
         .toast-container.position-fixed.bottom-0.end-0 -> pins the
         toast to the bottom-right corner of the viewport.
         Toasts are NOT shown automatically — JS must call .show().
         aria-live="assertive" so screen readers announce it.
       ============================================================ -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="saveToast" class="toast" role="alert"
         aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">Notification</strong>
        <small class="text-muted">just now</small>
        <button type="button" class="btn-close"
                data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body">Changes saved successfully.</div>
    </div>
  </div>

  <hr class="my-4">

  <!-- ============================================================
       3) TOOLTIP BUTTONS
       Buttons now have visible content (an emoji/icon), because the
       manual's version was empty and nothing could be hovered.
       data-bs-title is the BS5.3-safe way to set the tooltip text.
       ============================================================ -->
  <h3 class="h6">Toolbar (hover for tooltips)</h3>
  <div class="d-flex gap-2 mb-4">
    <button type="button" class="btn btn-outline-dark"
            data-bs-toggle="tooltip" data-bs-placement="top"
            data-bs-title="Archive this email">📦</button>

    <button type="button" class="btn btn-outline-dark"
            data-bs-toggle="tooltip" data-bs-placement="top"
            data-bs-title="Move to trash">🗑️</button>

    <button type="button" class="btn btn-outline-dark"
            data-bs-toggle="tooltip" data-bs-placement="top"
            data-bs-title="Mark as unread">✉️</button>
  </div>

  <!-- ============================================================
       4) HELP POPOVER (click-triggered by default)
       data-bs-title  -> popover heading
       data-bs-content-> popover body text
       ============================================================ -->
  <h3 class="h6">Popover</h3>
  <button type="button" class="btn btn-outline-info"
          data-bs-toggle="popover" data-bs-placement="right"
          data-bs-title="Help"
          data-bs-content="Click Save to store your changes locally. Nothing is uploaded.">
    ❓ Help
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ============================================================
       MANUAL INITIALIZATION
       Tooltips and popovers are OPT-IN in Bootstrap 5 (for performance,
       Bootstrap does not scan the whole page for them). We must create
       an instance for every element that has the matching data attribute.
       ============================================================ -->
  <script>
    // --- Tooltips ---
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
      new bootstrap.Tooltip(el);
    });

    // --- Popovers ---
    document.querySelectorAll('[data-bs-toggle="popover"]').forEach(function (el) {
      new bootstrap.Popover(el);
    });

    // --- Toast: create the instance once, then .show() on click ---
    const saveToastEl = document.getElementById('saveToast');
    const saveToast   = new bootstrap.Toast(saveToastEl, { delay: 3000 }); // auto-hide after 3s

    document.getElementById('saveBtn').addEventListener('click', function () {
      saveToast.show();
    });
  </script>
</body>
</html>
