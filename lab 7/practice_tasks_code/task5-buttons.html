<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 5.2 — Buttons &amp; Button Groups</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h2 class="h4 mb-3">1. Six Solid Contextual Buttons</h2>

  <!-- .btn is the base class (padding, border-radius, transition).
       The second class is the contextual colour. -->
  <div class="d-flex flex-wrap gap-2 mb-4">
    <button type="button" class="btn btn-primary">Primary</button>
    <button type="button" class="btn btn-secondary">Secondary</button>
    <button type="button" class="btn btn-success">Success</button>
    <button type="button" class="btn btn-danger">Danger</button>
    <!-- text-dark added for accessible contrast on yellow -->
    <button type="button" class="btn btn-warning text-dark">Warning</button>
    <button type="button" class="btn btn-info text-dark">Info</button>
  </div>

  <h2 class="h4 mb-3">2. Same Six as Outline Variants</h2>

  <!-- btn-outline-* = transparent background, coloured border + text.
       Visually lower emphasis than the solid versions. -->
  <div class="d-flex flex-wrap gap-2 mb-4">
    <button type="button" class="btn btn-outline-primary">Primary</button>
    <button type="button" class="btn btn-outline-secondary">Secondary</button>
    <button type="button" class="btn btn-outline-success">Success</button>
    <button type="button" class="btn btn-outline-danger">Danger</button>
    <button type="button" class="btn btn-outline-warning">Warning</button>
    <button type="button" class="btn btn-outline-info">Info</button>
  </div>

  <h2 class="h4 mb-3">3. Button Group (Bold / Italic / Underline)</h2>

  <!-- .btn-group removes the gap between buttons and merges the
       inner border-radius so they read as one control. -->
  <div class="btn-group mb-4" role="group" aria-label="Text formatting">
    <button type="button" class="btn btn-outline-dark">Bold</button>
    <button type="button" class="btn btn-outline-dark">Italic</button>
    <button type="button" class="btn btn-outline-dark">Underline</button>
  </div>

  <h2 class="h4 mb-3">4. Sizes (lg vs sm)</h2>
  <div class="d-flex align-items-center gap-2 mb-4">
    <button type="button" class="btn btn-primary btn-lg">Large Primary</button>
    <button type="button" class="btn btn-secondary btn-sm">Small Secondary</button>
  </div>

  <h2 class="h4 mb-3">5. Disabled Button</h2>
  <!-- The native `disabled` attribute blocks clicks AND removes the
       element from the tab order. Inspect it in DevTools to confirm. -->
  <button type="button" class="btn btn-success" disabled>Processing...</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
