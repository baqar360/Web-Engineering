<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3.2 — Typography, Colors &amp; Alignment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- ============================================================
       HERO: large, bold, centered heading + muted subtitle
       display-4  -> very large display heading (larger than h1)
       fw-bold    -> font-weight: 700
       text-center-> text-align: center
       text-muted -> muted grey text
       fs-5       -> font-size step 5 (Bootstrap 5.3 font-size scale)
       ============================================================ -->
  <section class="container text-center py-5">
    <h1 class="display-4 fw-bold">Build Faster with Bootstrap</h1>
    <p class="fs-5 text-muted">
      Utility classes replace hundreds of lines of hand-written CSS.
    </p>
  </section>

  <!-- ============================================================
       THREE COLORED TEXT BLOCKS
       text-primary / text-success / text-danger pull from the theme
       palette (CSS variables --bs-primary, --bs-success, ...).
       ============================================================ -->
  <section class="container mb-4">
    <div class="row g-3 text-center">
      <div class="col-md-4">
        <p class="text-primary fw-semibold mb-0">Primary colored text</p>
      </div>
      <div class="col-md-4">
        <p class="text-success fw-semibold mb-0">Success colored text</p>
      </div>
      <div class="col-md-4">
        <p class="text-danger fw-semibold mb-0">Danger colored text</p>
      </div>
    </div>
  </section>

  <!-- ============================================================
       CALL-TO-ACTION BLOCK
       bg-dark + text-white + p-4 (generous padding) + mt-5 (top margin)
       ============================================================ -->
  <section class="container">
    <div class="bg-dark text-white p-4 rounded mt-5 text-center">
      <h3 class="h5 mb-2">Ready to start?</h3>
      <p class="mb-0">This whole block is styled with utility classes only.</p>
    </div>
  </section>

  <!-- ============================================================
       mx-auto DEMO — horizontal auto-centering WITHOUT Flexbox.
       mx-auto only works on a block element that has an explicit width.
       ============================================================ -->
  <section class="container my-5">
    <div class="bg-secondary text-white text-center p-3 rounded mx-auto"
         style="width: 300px;">
      Centered with <code>mx-auto</code> (width: 300px)
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
