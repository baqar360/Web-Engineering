<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 9.2 — List Group, Nav &amp; Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- ============================================================
       RESPONSIVE NAVBAR
         navbar-expand-lg -> links visible from lg (>=992px) upward,
                             hamburger below that.
         navbar-dark bg-dark -> dark theme (use navbar-light for light).
         ms-auto -> margin-start auto = push this element to the far right.
       ============================================================ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

      <!-- Brand / logo -->
      <a class="navbar-brand fw-bold" href="#">MySite</a>

      <!-- Hamburger toggle. data-bs-target MUST match the collapse id. -->
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMenu"
              aria-controls="navMenu" aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Collapsible wrapper -->
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>

          <!-- Login button pushed to the right of the links -->
          <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
            <a class="btn btn-primary btn-sm" href="#">Login</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-4">

      <!-- ============================================================
           VERTICAL LIST GROUP — email folder list
           .active   -> highlighted/current item
           .disabled -> greyed out, non-clickable
           ============================================================ -->
      <div class="col-md-4">
        <h2 class="h5 mb-3">Mail Folders</h2>
        <ul class="list-group">
          <li class="list-group-item active" aria-current="true">Inbox</li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Sent
            <span class="badge bg-primary rounded-pill">12</span>
          </li>
          <li class="list-group-item">Drafts</li>
          <li class="list-group-item disabled" aria-disabled="true">Trash (locked)</li>
        </ul>
      </div>

      <!-- ============================================================
           HORIZONTAL PILL NAV — tab-like filters
           .nav-pills   -> rounded pill styling
           .flex-column flex-sm-row -> stack on phones, row on wider screens
           ============================================================ -->
      <div class="col-md-8">
        <h2 class="h5 mb-3">Task Filters</h2>
        <ul class="nav nav-pills flex-column flex-sm-row">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">All</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="#">Active</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Completed</a></li>
        </ul>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
