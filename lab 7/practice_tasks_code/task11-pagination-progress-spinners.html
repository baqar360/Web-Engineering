<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 11.2 — Pagination, Progress Bars &amp; Spinners</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <!-- ============================================================
       1) PAGINATION — 5 pages, page 1 active, Previous disabled
       .disabled on a <li> greys out and blocks the link.
       .active   marks the current page.
       ============================================================ -->
  <h2 class="h4 mb-3">Pagination</h2>
  <nav aria-label="Search results pages">
    <ul class="pagination">
      <!-- Previous is disabled because we are on page 1 -->
      <li class="page-item disabled">
        <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Previous</a>
      </li>
      <li class="page-item active" aria-current="page">
        <a class="page-link" href="#">1</a>
      </li>
      <li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item"><a class="page-link" href="#">3</a></li>
      <li class="page-item"><a class="page-link" href="#">4</a></li>
      <li class="page-item"><a class="page-link" href="#">5</a></li>
      <li class="page-item">
        <a class="page-link" href="#">Next</a>
      </li>
    </ul>
  </nav>

  <!-- ============================================================
       2) THREE COLORED PROGRESS BARS — 30%, 60%, 90%
       .progress      -> the grey track
       .progress-bar  -> the colored fill; width set inline
       role/aria-*    -> accessibility metadata
       ============================================================ -->
  <h2 class="h4 mb-3 mt-4">Progress Bars</h2>

  <div class="progress mb-3" role="progressbar"
       aria-label="Success progress" aria-valuenow="30"
       aria-valuemin="0" aria-valuemax="100" style="height: 22px;">
    <div class="progress-bar bg-success" style="width: 30%;">30%</div>
  </div>

  <div class="progress mb-3" role="progressbar"
       aria-label="Warning progress" aria-valuenow="60"
       aria-valuemin="0" aria-valuemax="100" style="height: 22px;">
    <div class="progress-bar bg-warning text-dark" style="width: 60%;">60%</div>
  </div>

  <div class="progress mb-3" role="progressbar"
       aria-label="Danger progress" aria-valuenow="90"
       aria-valuemin="0" aria-valuemax="100" style="height: 22px;">
    <div class="progress-bar bg-danger" style="width: 90%;">90%</div>
  </div>

  <!-- ============================================================
       3) STRIPED + ANIMATED PROGRESS BAR
       .progress-bar-striped  -> diagonal stripe pattern
       .progress-bar-animated -> scrolls the stripes (CSS animation)
       ============================================================ -->
  <div class="progress mb-4" role="progressbar"
       aria-label="Uploading" aria-valuenow="75"
       aria-valuemin="0" aria-valuemax="100" style="height: 22px;">
    <div class="progress-bar progress-bar-striped progress-bar-animated bg-info"
         style="width: 75%;">Uploading…</div>
  </div>

  <!-- ============================================================
       4) SPINNERS
       .spinner-border      -> rotating ring
       .spinner-border-sm   -> smaller version for inside buttons
       .visually-hidden     -> accessible label that sighted users
                               don't see but screen readers read
       ============================================================ -->
  <h2 class="h4 mb-3">Spinners</h2>

  <!-- Standalone spinner -->
  <div class="spinner-border text-primary mb-3" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>

  <br>

  <!-- "Logging in..." button pattern -->
  <button class="btn btn-primary" type="button" disabled>
    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
    Logging in...
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
