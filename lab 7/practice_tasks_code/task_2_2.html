<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2.2 — Grid System &amp; Breakpoints</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- ============================================================
       1) FULL-WIDTH HERO
       .container-fluid = 100% of the viewport, no max-width.
       Used for hero banners / dashboards / image galleries.
       ============================================================ -->
  <section class="container-fluid bg-primary text-white text-center py-5">
    <h1 class="display-5 fw-bold">Full-Width Hero Banner</h1>
    <p class="lead mb-0">Built with <code>.container-fluid</code> — spans edge to edge.</p>
  </section>

  <!-- ============================================================
       2) PRODUCT BOXES  (2 per row on phones, 4 per row from md up)
       col-6     -> unprefixed, applies to ALL widths = 6/12 = 50%
       col-md-3  -> from md (>=768px) upward = 3/12 = 25%
       g-4       -> gutter (gap) size 4 between columns
       ============================================================ -->
  <section class="container mt-4">
    <h2 class="h4 mb-3">Product Boxes — <code>col-6 col-md-3</code> with <code>g-4</code></h2>

    <div class="row g-4">
      <!-- .row is a Flexbox row; .col-* children are Flexbox items -->
      <div class="col-6 col-md-3">
        <div class="bg-info text-white p-4 text-center rounded">Product 1</div>
      </div>
      <div class="col-6 col-md-3">
        <div class="bg-info text-white p-4 text-center rounded">Product 2</div>
      </div>
      <div class="col-6 col-md-3">
        <div class="bg-info text-white p-4 text-center rounded">Product 3</div>
      </div>
      <div class="col-6 col-md-3">
        <div class="bg-info text-white p-4 text-center rounded">Product 4</div>
      </div>
    </div>
  </section>

  <!-- ============================================================
       3) SIDEBAR + MAIN CONTENT
       col-12 col-md-3 -> full width (stacked) below md,
                          then 25% width from md upward.
       ============================================================ -->
  <section class="container my-4">
    <h2 class="h4 mb-3">Sidebar + Main Content</h2>

    <div class="row g-4">
      <div class="col-12 col-md-3">
        <div class="bg-warning p-4 rounded">Sidebar (col-12 col-md-3)</div>
      </div>
      <div class="col-12 col-md-9">
        <div class="bg-light border p-4 rounded">Main Content (col-12 col-md-9)</div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
