<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 12.2 — Tables</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h2 class="h4 mb-3">Order List</h2>

  <!-- ============================================================
       .table-responsive  -> on narrow screens the table scrolls
                             horizontally instead of squashing columns.
       .table             -> base Bootstrap table styling
       .table-striped     -> zebra-striped rows
       .table-hover       -> highlights the row under the mouse
       .table-success / .table-warning / .table-danger
                          -> contextual row colouring
       ============================================================ -->
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th scope="col">#</th>
          <th scope="col">Order ID</th>
          <th scope="col">Customer</th>
          <th scope="col">Amount</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Completed -->
        <tr class="table-success">
          <th scope="row">1</th>
          <td>#ORD-1001</td>
          <td>Ali Raza</td>
          <td>$120</td>
          <td><span class="badge bg-success">Completed</span></td>
        </tr>

        <!-- Completed -->
        <tr class="table-success">
          <th scope="row">2</th>
          <td>#ORD-1002</td>
          <td>Hina Malik</td>
          <td>$75</td>
          <td><span class="badge bg-success">Completed</span></td>
        </tr>

        <!-- Pending -->
        <tr class="table-warning">
          <th scope="row">3</th>
          <td>#ORD-1003</td>
          <td>Sara Khan</td>
          <td>$85</td>
          <td><span class="badge bg-warning text-dark">Pending</span></td>
        </tr>

        <!-- Failed -->
        <tr class="table-danger">
          <th scope="row">4</th>
          <td>#ORD-1004</td>
          <td>Bilal Ahmed</td>
          <td>$40</td>
          <td><span class="badge bg-danger">Failed</span></td>
        </tr>

        <!-- Pending -->
        <tr class="table-warning">
          <th scope="row">5</th>
          <td>#ORD-1005</td>
          <td>Usman Tariq</td>
          <td>$210</td>
          <td><span class="badge bg-warning text-dark">Pending</span></td>
        </tr>

        <!-- Completed -->
        <tr class="table-success">
          <th scope="row">6</th>
          <td>#ORD-1006</td>
          <td>Zainab Fatima</td>
          <td>$60</td>
          <td><span class="badge bg-success">Completed</span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
